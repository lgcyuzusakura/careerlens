name: careerlens
services:
  ai-service:
    image: careerlens-ai:${RELEASE_TAG:-v0.1-dev}
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-m.daocloud.io/docker.io/library/python:3.11.14-slim-bookworm@sha256:65a93d69fa75478d554f4ad27c85c1e69fa184956261b4301ebaf6dbb0a3543d}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      LLM_MODE: ${LLM_MODE:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports: ["127.0.0.1:8082:8082"]
    restart: unless-stopped
    mem_limit: 384m
  domain-api:
    image: careerlens-java:${RELEASE_TAG:-v0.1-dev}
    build:
      context: .
      dockerfile: services/domain-api/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-m.daocloud.io/docker.io/library/maven:3.9.11-eclipse-temurin-21@sha256:6fdc855a6ed81d288ca7ca37ac6ff5e9308b612485c0801d70b25a858c83d237}
        JRE_IMAGE: ${JRE_IMAGE:-m.daocloud.io/docker.io/library/eclipse-temurin:21.0.9_10-jre-alpine@sha256:08eecc477dbe3f2e33daac27f36e41daf7f4ec51d2f3396006e54fa41832c74c}
    environment:
      PYTHON_URL: http://ai-service:8082
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      ai-service: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 512m
  bff:
    image: careerlens-bff:${RELEASE_TAG:-v0.1-dev}
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-m.daocloud.io/docker.io/library/node:24.11.0-alpine@sha256:f36fed0b2129a8492535e2853c64fbdbd2d29dc1219ee3217023ca48aebd3787}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    environment:
      DOMAIN_URL: http://domain-api:8080
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      domain-api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 256m
  web:
    image: careerlens-web:${RELEASE_TAG:-v0.1-dev}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-m.daocloud.io/docker.io/library/node:24.11.0-alpine@sha256:f36fed0b2129a8492535e2853c64fbdbd2d29dc1219ee3217023ca48aebd3787}
        NGINX_IMAGE: ${NGINX_IMAGE:-m.daocloud.io/docker.io/library/nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      bff: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 128m
