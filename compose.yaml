name: careerlens
services:
  ai-service:
    image: careerlens-ai:${RELEASE_TAG:-v0.1-dev}
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-m.daocloud.io/docker.io/library/python:3.11.14-slim-bookworm}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      LLM_MODE: ${LLM_MODE:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports: ["127.0.0.1:8082:8082"]
    restart: unless-stopped
    mem_limit: 384m
  domain-api:
    image: careerlens-java:${RELEASE_TAG:-v0.1-dev}
    build:
      context: .
      dockerfile: services/domain-api/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-m.daocloud.io/docker.io/library/maven:3.9.11-eclipse-temurin-21}
        JRE_IMAGE: ${JRE_IMAGE:-m.daocloud.io/docker.io/library/eclipse-temurin:21.0.9_10-jre-alpine}
    environment:
      PYTHON_URL: http://ai-service:8082
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      ai-service: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 512m
  bff:
    image: careerlens-bff:${RELEASE_TAG:-v0.1-dev}
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-m.daocloud.io/docker.io/library/node:24.11.0-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    environment:
      DOMAIN_URL: http://domain-api:8080
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      domain-api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 256m
  web:
    image: careerlens-web:${RELEASE_TAG:-v0.1-dev}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-m.daocloud.io/docker.io/library/node:24.11.0-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-m.daocloud.io/docker.io/library/nginx:1.28.0-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      bff: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 128m
