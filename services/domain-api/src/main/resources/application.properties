server.port=8080
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
careerlens.python-url=${PYTHON_URL:http://ai-service:8082}
careerlens.python-timeout-ms=${PYTHON_TIMEOUT_MS:38000}
logging.level.root=WARN
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:/data/careerlens;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=${DATABASE_PASSWORD:}
spring.h2.console.enabled=false
careerlens.jwt-secret=${JWT_SECRET:}
careerlens.admin-username=${ADMIN_USERNAME:admin}
careerlens.admin-password=${ADMIN_PASSWORD:}
