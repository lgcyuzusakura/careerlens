map $request_id $error_trace {
  "~^(.{8})(.{4}).(.{3}).(.{3})(.{12})$" $1-$2-4$3-8$4-$5;
}
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 160k;
  server_tokens off;
  access_log off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location = /healthz { access_log off; return 200 'UP'; }
  error_page 413 = @payload_too_large;
  location @payload_too_large {
    default_type application/json;
    add_header X-Trace-Id $error_trace always;
    add_header Cache-Control no-store always;
    return 413 '{"code":"PAYLOAD_TOO_LARGE","msg":"材料过大，请缩短文本。","data":null}';
  }
  location /api/ {
    proxy_pass http://bff:8081;
    proxy_connect_timeout 2s;
    proxy_read_timeout 24s;
    proxy_send_timeout 24s;
    proxy_intercept_errors off;
    proxy_set_header Host $host;
  }
  location / { try_files $uri $uri/ /index.html; }
}
